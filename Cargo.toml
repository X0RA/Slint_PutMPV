[package]
name = "putmpv"
version = "0.1.0"
edition = "2021"

[dependencies]
slint = { version = "1.16", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit-wayland",
    "renderer-femtovg",
] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
open = "5"
regex = "1"
once_cell = "1"
rfd = "0.15"
libmpv2 = { version = "5", features = ["render"] }
glow = "0.13"
magneto = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3", features = ["wayland-data-control"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
arboard = { version = "3" }

[build-dependencies]
slint-build = "1.16"
winres = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev-fast]
inherits = "dev"
opt-level = 0
debug = 0
lto = false
incremental = true
codegen-units = 256
